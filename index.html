<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDMIND 160, biblioteca visual para CONAREME 2027</title>
  <meta name="description" content="Fichas médicas visuales de una página para preparar el Residentado Médico del Perú.">
  <style>
/* =====================================================================
   MEDMIND 160 · ESTILOS
   Los colores y tamaños principales están en las variables de :root.
   Cambia un valor allí y se actualiza toda la página.
   ===================================================================== */

:root {
  color-scheme: light;

  --bg: #fcf9f4;          /* blanco cálido */
  --surface: #ffffff;
  --ink: #2c2a35;
  --muted: #625f70;
  --line: #e8e1d4;

  --lav: #ece7fa;         /* lavanda */
  --lav-ink: #4f3f93;
  --mint: #def3ea;        /* menta */
  --mint-ink: #1d654c;
  --beige: #f4ecdd;       /* beige */
  --beige-ink: #70531c;
  --rose: #fbe6ec;        /* rosa */
  --rose-ink: #8f3452;

  --accent: #5a4a9e;
  --accent-dark: #44367f;

  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(60, 50, 90, .06), 0 6px 18px rgba(60, 50, 90, .05);

  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-title: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.55;
}

h1, h2, h3, h4 {
  font-family: var(--font-title);
  font-weight: 700;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
}
h1 { font-size: clamp(1.7rem, 4.2vw, 2.4rem); letter-spacing: -.01em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
h4 { font-size: 1rem; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }

a { color: var(--accent); }
a:hover { color: var(--accent-dark); }

:focus-visible {
  outline: 3px solid #8f7fd6;
  outline-offset: 2px;
  border-radius: 6px;
}
main:focus { outline: none; }
h1:focus { outline: none; }

.wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 20px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  background: var(--surface);
  padding: 8px 14px;
  border-radius: 8px;
  z-index: 10;
}
.skip:focus { left: 12px; }

/* ---------- Encabezado ---------- */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.header-inner { padding-top: 14px; padding-bottom: 14px; }
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--ink);
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: var(--lav);
  color: var(--lav-ink);
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 1.35rem;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-family: var(--font-title); font-size: 1.15rem; letter-spacing: .01em; }
.brand-text small { color: var(--muted); font-size: .85rem; }

main { padding-top: 28px; padding-bottom: 48px; }

.site-footer {
  border-top: 1px solid var(--line);
  padding: 20px 0 32px;
  color: var(--muted);
  font-size: .88rem;
}

/* ---------- Biblioteca ---------- */
.intro { max-width: 46rem; margin-bottom: 22px; }
.intro p { margin-top: 8px; color: var(--muted); font-size: 1.05rem; }

.panel-busqueda {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 16px;
}

.buscador label { display: block; font-weight: 600; margin-bottom: 6px; }
.buscador input {
  width: 100%;
  font: inherit;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
}
.buscador input:focus { border-color: #8f7fd6; outline: none; box-shadow: 0 0 0 3px #e3dcfa; }

.filtros { display: grid; gap: 12px; }
.grupo-filtro { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grupo-filtro .titulo { font-weight: 600; margin-right: 4px; font-size: .95rem; }

.chip {
  font: inherit;
  font-size: .92rem;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.chip:hover { background: var(--lav); }
.chip[aria-pressed="true"] {
  background: var(--lav);
  border-color: #a99ae0;
  color: var(--lav-ink);
  font-weight: 600;
}

.resultados-barra {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 0 14px;
  color: var(--muted);
}
.link-btn {
  font: inherit;
  background: none;
  border: none;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
  padding: 4px;
}

.grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card--pendiente { background: #fffdf9; box-shadow: none; border-style: dashed; }
.card-etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
.card p { color: var(--muted); font-size: .96rem; flex: 1; }
.card-pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 600;
  background: var(--beige);
  color: var(--beige-ink);
}
.badge--esp { background: var(--lav); color: var(--lav-ink); }
.badge--tipo { background: var(--mint); color: var(--mint-ink); }
.badge--demo { background: var(--rose); color: var(--rose-ink); }
.badge--pend { background: var(--beige); color: var(--beige-ink); }

.btn {
  display: inline-block;
  font: inherit;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1.5px solid var(--accent);
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background: var(--accent-dark); color: #fff; }
.btn--suave { background: var(--surface); color: var(--accent); }
.btn--suave:hover { background: var(--lav); color: var(--accent-dark); }
.btn--off {
  background: transparent;
  border-color: var(--line);
  color: var(--muted);
  cursor: default;
}
.btn--off:hover { background: transparent; color: var(--muted); }

.vacio {
  grid-column: 1 / -1;
  text-align: center;
  padding: 36px 16px;
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
}

/* ---------- Ficha ---------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  margin-bottom: 18px;
}

.ficha { display: grid; gap: 16px; }
.ficha-cabecera {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 10px;
}
.ficha-cabecera .card-etiquetas { margin-bottom: 2px; }
.ficha-cabecera p { color: var(--muted); }
.ficha-meta { font-size: .9rem; }

.aviso {
  background: var(--rose);
  color: #5d2236;
  border: 1px solid #f1c4d0;
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: .93rem;
}
.aviso strong { color: var(--rose-ink); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: grid;
  gap: 14px;
}
.panel > h2 { margin-bottom: 0; }
.panel--pivote { background: var(--lav); border-color: #d8cff4; }
.panel--diagnostico { background: var(--mint); border-color: #c3e6d7; }
.panel--diferenciales { background: var(--beige); border-color: #e6d9bf; }
.panel--trampas { background: var(--rose); border-color: #f1c4d0; }
.panel--caso { background: var(--mint); border-color: #c3e6d7; }
.panel--fuentes { background: var(--beige); border-color: #e6d9bf; }

.destacado {
  font-family: var(--font-title);
  font-size: 1.3rem;
  line-height: 1.35;
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
}
.lista { display: grid; gap: 8px; padding-left: 1.2rem; }
.lista li { padding-left: 2px; }

.diagnostico-principal {
  font-family: var(--font-title);
  font-size: 1.3rem;
  font-weight: 700;
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
}

.criterios { display: grid; gap: 10px; background: var(--surface); border-radius: var(--radius-sm); padding: 14px 16px; }
.criterios h3 { font-size: 1.02rem; }
.criterio-grupo h4 { color: var(--mint-ink); margin-bottom: 2px; }
.criterio-grupo ul { list-style: none; display: grid; gap: 2px; font-size: .95rem; }
.reglas { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }

.dif-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.dif {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: grid;
  gap: 4px;
  align-content: start;
}
.dif h3 { font-size: 1rem; }
.dif p { font-size: .94rem; color: var(--ink); }

/* Algoritmos */
.panel--algoritmo { background: var(--surface); }
.flow-bloque { display: grid; gap: 12px; }
.flow-bloque + .flow-bloque { border-top: 1px solid var(--line); padding-top: 18px; }
.flow { list-style: none; display: grid; gap: 0; }
.paso {
  position: relative;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  padding-bottom: 18px;
}
.paso:last-child { padding-bottom: 0; }
.paso::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 34px;
  bottom: 2px;
  width: 2px;
  background: #d8cff4;
}
.paso:last-child::before { display: none; }
.paso-num {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--lav);
  color: var(--lav-ink);
  font-weight: 700;
}
.paso-cuerpo { display: grid; gap: 6px; align-content: start; padding-top: 4px; }
.paso-cuerpo p { font-size: .96rem; }

.ramas { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 4px; }
.rama {
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: grid;
  gap: 6px;
  align-content: start;
  font-size: .93rem;
}
.rama strong { font-size: .98rem; }
.rama-accion { font-weight: 600; border-top: 1px solid rgba(0,0,0,.12); padding-top: 6px; }
.tono-leve { background: var(--mint); color: #17493a; }
.tono-moderado { background: var(--beige); color: #55400f; }
.tono-grave { background: var(--rose); color: #6a2339; }
.tono-neutro { background: var(--lav); color: #35296f; }

.trampas { display: grid; gap: 8px; padding-left: 1.2rem; }

/* Caso clínico */
.caso-enunciado { background: var(--surface); border-radius: var(--radius-sm); padding: 14px 16px; }
.caso-pregunta { font-weight: 700; }
.opciones { display: grid; gap: 8px; }
.opcion {
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: start;
  gap: 10px;
  text-align: left;
  font: inherit;
  padding: 10px 12px;
  border: 1.5px solid #c3e6d7;
  background: var(--surface);
  border-radius: var(--radius-sm);
  color: var(--ink);
  cursor: pointer;
}
.opcion:hover { border-color: var(--mint-ink); }
.opcion-letra {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--mint);
  color: var(--mint-ink);
  font-weight: 700;
}
.opcion.correcta { border-color: #2a8a66; background: #e4f6ee; }
.opcion.incorrecta { border-color: #c2587a; background: #fdecf1; }
.opcion:disabled { cursor: default; color: var(--ink); }

.respuesta {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: grid;
  gap: 8px;
}
.respuesta .veredicto { font-weight: 700; }
.respuesta .veredicto.ok { color: var(--mint-ink); }
.respuesta .veredicto.mal { color: var(--rose-ink); }

.fuentes { display: grid; gap: 8px; padding-left: 1.2rem; font-size: .94rem; }
.fuentes a { word-break: break-word; }

/* ---------- Pantallas pequeñas ---------- */
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  main { padding-top: 20px; }
  .panel, .ficha-cabecera { padding: 16px; }
  .destacado, .diagnostico-principal { font-size: 1.15rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

/* =====================================================================
   IMPRESIÓN (A4): oculta los controles y deja la ficha legible en papel
   ===================================================================== */
@page { size: A4; margin: 12mm; }

@media print {
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    box-shadow: none !important;
  }
  html { font-size: 9.5pt; }
  body { background: #fff; color: #000; line-height: 1.4; }

  .no-print, .site-header, .site-footer, .toolbar, .skip { display: none !important; }

  .wrap { max-width: none; padding: 0; }
  main { padding: 0; }

  h1 { font-size: 17pt; }
  h2 { font-size: 12pt; }
  h3 { font-size: 10.5pt; }

  .ficha { gap: 8px; }
  .ficha-cabecera, .panel { padding: 10px 12px; border-radius: 10px; }
  .panel { gap: 8px; }
  /* Los paneles largos pueden partirse entre páginas; lo pequeño se mantiene junto */
  .dif, .rama, .paso, .criterios, .respuesta, .caso-enunciado, .opcion { break-inside: avoid; page-break-inside: avoid; }
  .panel > h2, .flow-bloque > h3, .paso-cuerpo > h4 { break-after: avoid; page-break-after: avoid; }
  .ficha-cabecera { break-inside: avoid; }

  /* Los navegadores parten mal las cuadrículas entre páginas (se solapan
     bloques), así que en papel los contenedores largos pasan a flujo normal. */
  .ficha, .panel, .flow-bloque, .flow, .paso-cuerpo { display: block; }
  .ficha > * + *, .panel > * + *, .flow-bloque > * + *, .paso-cuerpo > * + * { margin-top: 8px; }
  .paso { display: flex; gap: 10px; }
  .paso-cuerpo { flex: 1; }
  .flow-bloque + .flow-bloque { margin-top: 14px; }
  .aviso { font-size: 8.5pt; padding: 6px 10px; }
  .destacado, .diagnostico-principal { font-size: 11.5pt; padding: 8px 10px; }
  .dif-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .dif, .rama { padding: 7px 9px; }
  .ramas { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .paso { padding-bottom: 10px; }

  /* En papel siempre se muestra la respuesta del caso clínico */
  .respuesta[hidden] { display: grid !important; }
  .respuesta .veredicto:empty { display: none; }
  .opcion { cursor: default; }
  .btn, .opciones-reiniciar { display: none !important; }

  /* En papel se imprime la dirección de cada enlace de las fuentes */
  .fuentes a[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 8pt;
    word-break: break-all;
  }
}

</style>
</head>
<body>
  <a class="skip no-print" href="#contenido">Saltar al contenido</a>

  <header class="site-header no-print">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="MEDMIND 160, volver a la biblioteca">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-text">
          <strong>MEDMIND 160</strong>
          <small>Biblioteca visual para CONAREME 2027</small>
        </span>
      </a>
    </div>
  </header>

  <main id="contenido" class="wrap" tabindex="-1">
    <noscript><p class="aviso">Esta página necesita JavaScript activado para mostrar las fichas.</p></noscript>
  </main>

  <footer class="site-footer no-print">
    <div class="wrap">
      <p>Material de estudio personal. El contenido médico debe verificarse en las fuentes citadas en cada ficha antes de usarlo para estudiar o decidir conductas clínicas.</p>
    </div>
  </footer>

  <script>
/* =====================================================================
   MEDMIND 160 · CONTENIDO DE LAS FICHAS
   ---------------------------------------------------------------------
   Este archivo contiene SOLO contenido (texto médico). La lógica de la
   página vive en app.js. Para agregar una ficha nueva:

     1. Copia el bloque "PLANTILLA" de más abajo (o una ficha completa).
     2. Pégalo dentro de la lista MEDMIND_FICHAS, separado por una coma.
     3. Cambia el id (sin espacios ni tildes, p. ej. "lupus-eritematoso").
     4. Guarda y recarga la página: aparecerá sola en la biblioteca.

   Trucos:
     - Para poner negrita en un texto escribe **así**.
     - estado: "completa" abre la ficha; "pendiente" muestra la tarjeta
       como "Próximamente" (sirve para ir planificando temas).
     - Si borras una sección (por ejemplo "trampas") la ficha sigue
       funcionando: simplemente no se muestra esa sección.
     - Nunca marques revisado: true si un docente o un médico no ha
       verificado el contenido contra fuentes fiables.

   PLANTILLA (copiar, pegar y rellenar):

   {
     id: "tema-en-minusculas",
     titulo: "Nombre del tema",
     especialidad: "Reumatología",
     tipo: "Ficha clínica",            // o "Algoritmo" / "Cuadro comparativo"
     descripcion: "Una o dos frases que resumen la ficha.",
     etiquetas: ["palabra clave 1", "palabra clave 2"],
     estado: "completa",
     revisado: false,
     actualizado: "2026-10-19",
     verificacion: { nota: "Qué se contrastó y qué falta verificar." },
     pivote: { destacado: "La frase clave.", puntos: ["punto 1", "punto 2"] },
     diagnostico: { principal: "Diagnóstico más probable", explicacion: "Por qué." },
     diferenciales: [{ nombre: "Otro diagnóstico", claves: "Cómo distinguirlo." }],
     algoritmos: [{ titulo: "Título del algoritmo", pasos: [
       { titulo: "Paso 1", detalle: "Qué hacer." }
     ]}],
     trampas: ["Error frecuente 1"],
     caso: {
       enunciado: "Paciente de ...",
       pregunta: "¿Cuál es el siguiente paso?",
       opciones: [{ letra: "A", texto: "..." }, { letra: "B", texto: "..." }],
       correcta: "A",
       explicacion: "Por qué A es correcta."
     },
     fuentes: [{ texto: "Autor. Título. Revista. Año.", url: "https://..." }]
   }
   ===================================================================== */

window.MEDMIND_FICHAS = [

  /* ------------------------------------------------------------------
     FICHA DE DEMOSTRACIÓN COMPLETA
     ------------------------------------------------------------------ */
  {
    id: "vias-biliares-colangitis",
    titulo: "Vías biliares: colangitis aguda y coledocolitiasis",
    especialidad: "Gastroenterología",
    tipo: "Ficha clínica",
    descripcion:
      "Del cólico biliar a la colangitis: cómo distinguir colecistitis, coledocolitiasis, colangitis y pancreatitis biliar, y cuándo drenar la vía biliar.",
    etiquetas: [
      "colangitis", "coledocolitiasis", "colecistitis", "ictericia", "Charcot",
      "Reynolds", "CPRE", "Tokio", "litiasis biliar", "pancreatitis biliar",
      "Mirizzi", "Courvoisier", "cirugía"
    ],
    estado: "completa",
    revisado: false,
    actualizado: "2026-10-19",
    verificacion: {
      nota:
        "Borrador de demostración elaborado con ayuda de IA. Se contrastaron con fuentes públicas (resúmenes de las Guías de Tokio 2018, MDCalc y resumen de la guía ASGE 2019) la estructura de los criterios diagnósticos, la clasificación por gravedad, el momento del drenaje, la CPRE como método de elección y la estratificación de riesgo de coledocolitiasis. Los umbrales numéricos finos (leucocitos, bilirrubina, albúmina, tamaño del colédoco) no se pudieron comprobar en el texto completo: confírmalos en las guías originales de la sección Fuentes. Aún NO ha sido revisado por un médico o docente."
    },

    pivote: {
      destacado:
        "Dolor en hipocondrio derecho + fiebre + ictericia (tríada de Charcot) → sospecha **colangitis aguda**.",

  /* Crea un elemento: h('div', { class: 'x' }, hijo1, hijo2) */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);

    }
    for (var i = 2; i < arguments.length; i++) agregar(el, arguments[i]);
    return el;
  }

  function agregar(el, hijo) {
    if (hijo === null || hijo === undefined || hijo === false) return;
    if (Array.isArray(hijo)) { hijo.forEach(function (x) { agregar(el, x); }); return; }

  function rico(texto) {

      .split(/(\*\*[^*]+\*\*)/)
      .forEach(function (parte) {
        if (/^\*\*[^*]+\*\*$/.test(parte)) frag.appendChild(h('strong', { text: parte.slice(2, -2) }));

  function normalizar(s) {

  function recolectarTexto(valor, salida) {

      limpiar.hidden = !(estado.q || estado.especialidad !== 'Todas' || estado.tipo !== 'Todos');
    }

    buscador.addEventListener('input', function () {
      estado.q = buscador.value;
      actualizar();
    });
    limpiar.addEventListener('click', function () {
      estado = { q: '', especialidad: 'Todas', tipo: 'Todos' };
      buscador.value = '';
      actualizar();
      buscador.focus();
    });

    var resumen = completas + (completas === 1 ? ' ficha lista' : ' fichas listas') +
      ' y ' + pendientes + (pendientes === 1 ? ' tema por redactar.' : ' temas por redactar.');

    var vista = h('div', null,
      h('section', { class: 'intro' },
        h('h1', { id: 'titulo-pagina', tabindex: '-1', text: 'Fichas médicas visuales' }),
        h('p', { text: 'Resúmenes de una página para el Residentado Médico: dato pivote, diferenciales, algoritmo y trampas de examen. Con énfasis en Reumatología. ' + resumen })
      ),
      h('section', { class: 'panel-busqueda no-print', 'aria-label': 'Buscar y filtrar fichas' },
        h('div', { class: 'buscador' },
          h('label', { for: 'buscar', text: 'Buscar fichas' }),
          buscador
        ),
        h('div', { class: 'filtros' },
          h('div', { class: 'grupo-filtro', role: 'group', 'aria-label': 'Filtrar por especialidad' },
            h('span', { class: 'titulo', text: 'Especialidad' }),
            chips(unicos('especialidad'), 'Todas', 'especialidad', botonesEsp)
          ),
          h('div', { class: 'grupo-filtro', role: 'group', 'aria-label': 'Filtrar por tipo de ficha' },
            h('span', { class: 'titulo', text: 'Tipo de ficha' }),
            chips(unicos('tipo'), 'Todos', 'tipo', botonesTipo)
          )
        )
      ),
      h('div', { class: 'resultados-barra no-print' }, contador, limpiar),
      grid
    );

    pintar(vista, 'MEDMIND 160, biblioteca visual para CONAREME 2027');
    actualizar();
  }

  /* ---------------------------------------------------------------
     Ficha
     --------------------------------------------------------------- */

  function seccion(clase, titulo) {
    var el = h('section', { class: 'panel ' + clase }, h('h2', { text: titulo }));
    for (var i = 2; i < arguments.length; i++) agregar(el, arguments[i]);
    return el;
  }

  function secPivote(p) {
    if (!p) return null;
    return seccion('panel--pivote', 'Dato pivote',
      p.destacado && h('p', { class: 'destacado' }, rico(p.destacado)),
      p.puntos && h('ul', { class: 'lista' }, p.puntos.map(function (t) { return h('li', null, rico(t)); }))
    );
  }

  function secDiagnostico(d) {
    if (!d) return null;
    var tabla = d.tabla && h('div', { class: 'criterios' },
      d.tablaTitulo && h('h3', { text: d.tablaTitulo }),
      d.tabla.map(function (g) {
        return h('div', { class: 'criterio-grupo' },
          h('h4', { text: g.grupo }),
          h('ul', null, (g.items || []).map(function (i) { return h('li', { text: i }); }))
        );
      }),
      (d.reglaSospecha || d.reglaDefinitivo) && h('div', { class: 'reglas' },
        d.reglaSospecha && h('p', null, rico(d.reglaSospecha)),
        d.reglaDefinitivo && h('p', null, rico(d.reglaDefinitivo))
      )
    );
    return seccion('panel--diagnostico', 'Diagnóstico más probable',
      d.principal && h('p', { class: 'diagnostico-principal', text: d.principal }),
      d.explicacion && h('p', null, rico(d.explicacion)),
      tabla
    );
  }

  function secDiferenciales(lista) {
    if (!lista || !lista.length) return null;
    return seccion('panel--diferenciales', 'Diagnósticos diferenciales y cómo distinguirlos',
      h('div', { class: 'dif-grid' }, lista.map(function (d) {
        return h('div', { class: 'dif' }, h('h3', { text: d.nombre }), h('p', null, rico(d.claves)));
      }))
    );
  }

  function secAlgoritmos(bloques) {
    if (!bloques || !bloques.length) return null;
    return seccion('panel--algoritmo', 'Algoritmo diagnóstico y conducta',
      bloques.map(function (b) {
        return h('div', { class: 'flow-bloque' },
          b.titulo && h('h3', { text: b.titulo }),
          h('ol', { class: 'flow' }, (b.pasos || []).map(function (p, i) {
            return h('li', { class: 'paso' },
              h('span', { class: 'paso-num', 'aria-hidden': 'true', text: String(i + 1) }),
              h('div', { class: 'paso-cuerpo' },
                h('h4', { text: p.titulo }),
                p.detalle && h('p', null, rico(p.detalle)),
                p.ramas && h('div', { class: 'ramas' }, p.ramas.map(function (r) {
                  return h('div', { class: 'rama tono-' + (r.tono || 'neutro') },
                    h('strong', { text: r.etiqueta }),
                    h('p', null, rico(r.texto)),
                    r.accion && h('p', { class: 'rama-accion' }, rico(r.accion))
                  );
                }))
              )
            );
          }))
        );
      })
    );
  }

  function secTrampas(lista) {
    if (!lista || !lista.length) return null;
    return seccion('panel--trampas', 'Trampas frecuentes de examen',
      h('ul', { class: 'trampas' }, lista.map(function (t) { return h('li', null, rico(t)); }))
    );
  }

  function secCaso(caso) {
    if (!caso) return null;
    var respondido = false;
    var veredicto = h('p', { class: 'veredicto', role: 'status' });
    var reiniciar = h('button', { type: 'button', class: 'btn btn--suave opciones-reiniciar', text: 'Intentar de nuevo' });
    var respuesta = h('div', { class: 'respuesta', hidden: true },
      veredicto,
      h('p', null, h('strong', { text: 'Respuesta correcta: ' + caso.correcta + '. ' }), rico(caso.explicacion)),
      reiniciar
    );
    var botones = [];

    (caso.opciones || []).forEach(function (o) {
      var b = h('button', { type: 'button', class: 'opcion', 'data-letra': o.letra },
        h('span', { class: 'opcion-letra', 'aria-hidden': 'true', text: o.letra }),
        h('span', { text: o.texto })
      );
      b.addEventListener('click', function () {
        if (respondido) return;
        respondido = true;
        var acerto = o.letra === caso.correcta;
        botones.forEach(function (x) {
          x.el.disabled = true;
          if (x.letra === caso.correcta) x.el.classList.add('correcta');
        });
        if (!acerto) b.classList.add('incorrecta');
        veredicto.textContent = acerto ? 'Correcto.' : 'No es esa. Revisa la explicación.';
        veredicto.className = 'veredicto ' + (acerto ? 'ok' : 'mal');
        respuesta.hidden = false;
      });
      botones.push({ letra: o.letra, el: b });
    });

    reiniciar.addEventListener('click', function () {
      respondido = false;
      botones.forEach(function (x) { x.el.disabled = false; x.el.classList.remove('correcta', 'incorrecta'); });
      veredicto.textContent = '';
      veredicto.className = 'veredicto';
      respuesta.hidden = true;
      botones[0] && botones[0].el.focus();
    });

    return seccion('panel--caso', 'Mini caso clínico y autoevaluación',
      h('p', { class: 'caso-enunciado' }, rico(caso.enunciado)),
      caso.pregunta && h('p', { class: 'caso-pregunta', text: caso.pregunta }),
      h('div', { class: 'opciones' }, botones.map(function (x) { return x.el; })),
      respuesta
    );
  }

  function secFuentes(lista) {
    if (!lista || !lista.length) return null;
    return seccion('panel--fuentes', 'Fuentes para verificar el contenido',
      h('ul', { class: 'fuentes' }, lista.map(function (s) {
        return h('li', null,
          s.texto,
          s.url && [' ', h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer', text: 'Abrir fuente' })]
        );
      }))
    );
  }

  function mostrarFicha(id) {
    var f = FICHAS.filter(function (x) { return x.id === id && esCompleta(x); })[0];
    if (!f) {
      pintar(h('div', { class: 'vacio' },
        h('h1', { id: 'titulo-pagina', tabindex: '-1', text: 'No encontramos esa ficha' }),
        h('p', { text: 'Puede que el enlace esté mal escrito o que la ficha todavía no esté redactada.' }),
        h('p', null, h('a', { class: 'btn', href: '#/' }, 'Volver a la biblioteca'))
      ), 'Ficha no encontrada, MEDMIND 160');
      return;
    }

    var titulo = 'MEDMIND 160, ' + f.titulo;

    var vista = h('div', null,
      h('div', { class: 'toolbar no-print' },
        h('a', { class: 'btn btn--suave', href: '#/' }, 'Volver a la biblioteca'),
        /* La vista previa dentro de Claude no puede abrir el cuadro de impresión;
           allí se activa MEDMIND_SIN_IMPRESION y el botón no se muestra. */
        !window.MEDMIND_SIN_IMPRESION && h('button', { type: 'button', class: 'btn', onclick: function () { window.print(); } }, 'Imprimir o guardar como PDF')
      ),
      h('article', { class: 'ficha' },
        h('header', { class: 'ficha-cabecera' },
          h('div', { class: 'card-etiquetas' },
            h('span', { class: 'badge badge--esp', text: f.especialidad }),
            h('span', { class: 'badge badge--tipo', text: f.tipo })
          ),
          h('h1', { id: 'titulo-pagina', tabindex: '-1', text: f.titulo }),
          h('p', null, rico(f.descripcion)),
          h('p', { class: 'ficha-meta' },
            'Actualizada el ' + (f.actualizado || 'sin fecha') + '. ' +
            (f.revisado ? 'Revisada.' : 'Sin revisión médica.')
          )
        ),
        !f.revisado && h('p', { class: 'aviso' },
          h('strong', { text: 'Verifica antes de estudiar. ' }),
          (f.verificacion && f.verificacion.nota) ||
          'Este contenido no ha sido revisado por un médico o docente. Contrástalo con las fuentes citadas.'
        ),
        secPivote(f.pivote),
        secDiagnostico(f.diagnostico),
        secDiferenciales(f.diferenciales),
        secAlgoritmos(f.algoritmos),
        secTrampas(f.trampas),
        secCaso(f.caso),
        secFuentes(f.fuentes)
      )
    );

    pintar(vista, titulo);
  }

  /* ---------------------------------------------------------------
     Navegación (usa el # de la dirección, funciona en GitHub Pages)
       #/            biblioteca
       #/ficha/<id>  una ficha
     --------------------------------------------------------------- */

  function pintar(vista, titulo) {
    main.replaceChildren(vista);
    document.title = titulo;
    window.scrollTo(0, 0);
    var t = document.getElementById('titulo-pagina');
    if (t) t.focus({ preventScroll: true });
  }

  function ruta() {
    var m = /^#\/ficha\/([^/?#]+)/.exec(window.location.hash);
    if (m) mostrarFicha(decodeURIComponent(m[1]));
    else mostrarBiblioteca();
  }

  validar();
  window.addEventListener('hashchange', ruta);
  ruta();
})();

</script>
</body>
</html>
